<div class="flex h-screen items-center justify-center">
  <div class="rounded-control border border-ink-muted w-max px-12 py-8 m-auto flex flex-col">
    <form [formRoot]="registerForm">
      <div class="control flex flex-col">
        <label for="email">Email:</label>
        <input
          class="control border boreder-ink rounded-control p-2 px-4"
          id="email"
          type="email"
          placeholder="your@mail.com"
          [formField]="registerForm.email"
        />
        @if (registerForm.email().touched() && registerForm.email().invalid()) {
          <span class="text-danger">Email is invalid</span>
        }
      </div>

      <div class="control flex flex-col">
        <label for="password">Password:</label>
        <input
          class="control border boreder-ink rounded-control p-2 px-4"
          id="password"
          type="password"
          placeholder="********"
          [formField]="registerForm.password"
        />
        @if (registerForm.password().touched() && registerForm.password().invalid()) {
          <span class="text-danger">Password is invalid</span>
        }
      </div>

      <button
        type="submit"
        [disabled]="registerForm().pending() || registerForm().invalid()"
        class="my-4 w-3xs rounded-control bg-primary px-4 py-2 text-ink cursor-pointer hover:bg-primary-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:opacity-50"
      >
        Register
      </button>
    </form>
  </div>
</div>
