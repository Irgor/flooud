<div class="flex h-screen items-center justify-center bg-surface">
  <div class="rounded-panel p-10 flex flex-col glass w-2/8">
    <form [formRoot]="loginForm">
      <p class="text-ink text-heading">Welcome back</p>
      <p class="text-muted text-sub-title">Log in to pick up where you left off.</p>
      <div class="control flex flex-col mt-6 mb-4">
        <label for="email" class="text-ink text-body-strong">Email:</label>
        <input
          class="border border-[0.91px] border-muted text-ink rounded-control h-[48px] px-[18px] mt-2"
          id="email"
          type="email"
          placeholder="your@mail.com"
          [formField]="loginForm.email"
        />
        @if (loginForm.email().touched() && loginForm.email().invalid()) {
          <span class="text-danger">Email is invalid</span>
        }
      </div>

      <div class="control flex flex-col">
        <label for="password" class="text-ink text-body-strong">Password:</label>
        <input
          class="border border-[0.91px] border-muted text-ink rounded-control h-[48px] px-[18px] mt-2"
          id="password"
          type="password"
          placeholder="********"
          [formField]="loginForm.password"
        />
        @if (loginForm.password().touched() && loginForm.password().invalid()) {
          <span class="text-danger">Password is invalid</span>
        }
      </div>

      <p class="my-6 text-end text-secondary text-cta-strong cursor-pointer hover:underline">
        Forgot password?
      </p>

      <button
        type="submit"
        [disabled]="loginForm().pending() || loginForm().invalid()"
        class="w-full rounded-control h-[49px] text-sub-title-strong bg-primary shadow-cta"
      >
        Log in
      </button>
    </form>
  </div>
</div>
